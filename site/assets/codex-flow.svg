  <g filter="url(#lift)"><rect x="371" y="129" width="334" height="270" rx="24" fill="#fffdf9" stroke="#abb7cc"/><text x="396" y="169" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="750" fill="#ae381d">INDEPENDENT WORK</text>
  <g fill="#edf0f6"><rect x="393" y="195" width="287" height="46" rx="6"/><rect x="393" y="251" width="287" height="46" rx="6"/><rect x="393" y="307" width="287" height="46" rx="6"/></g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" fill="#202124"><text x="408" y="225">Luna 01  ·  bounded task</text><text x="408" y="281">Luna 02  ·  separate scope</text><text x="408" y="337">Luna 03  ·  auditable proof</text></g><text x="394" y="380" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" fill="#485162">Up to 15 slots when the host supports them</text></g>
