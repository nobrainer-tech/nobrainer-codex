  <text x="77" y="224" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="29" font-weight="750" fill="#202124">Codex</text><text x="77" y="254" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" fill="#485162">Your chosen model</text>
  <path d="M77 284h187" stroke="#abb7cc"/><text x="77" y="317" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" fill="#202124">Keeps the goal</text><text x="77" y="344" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" fill="#202124">and checks the result</text></g>
