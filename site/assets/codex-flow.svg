<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" role="img" aria-labelledby="title desc">
  <title id="title">Codex and nobrainer-tech-flow workflow</title>
  <desc id="desc">Codex coordinates independently scoped Luna agents through nobrainer-tech-flow. Verified backups and a rollback gate protect data when moving to an external SSD.</desc>
  <defs>
    <filter id="lift" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172943" flood-opacity=".14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2948b8"/></marker>
  </defs>
  <rect width="760" height="590" rx="30" fill="#edf0f6"/>
  <path d="M46 82h668M46 496h668" stroke="#b6c2d3" stroke-width="2"/>
  <rect x="48" y="38" width="12" height="12" fill="#d94724"/><text x="71" y="49" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="800" font-size="17" fill="#202124">CODEX</text>
  <text x="146" y="49" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" fill="#485162">+</text>
